# Copy to site root: cp deploy/silk/.silk.ini ~/www-root/.silk.ini
#
# Architecture:
#   - Next.js (Node Unit) serves the site at /*
#   - FastAPI runs via systemd on 127.0.0.1:8000 (not Unit)
#   - Next rewrites /api/* → http://127.0.0.1:8000/api/*

[general]
document-root = public
max-request-length = 10485760
request-timeout = 60
redirect-insecure-http = true

[nodejs]
version = 22

[app: web]
type = nodejs
root = relax/deploy/silk/dist/web
uri = /*
document-root = public
startup-script = server.js
env.NODE_ENV = production
env.HOSTNAME = 127.0.0.1
env.PORT = 3000
