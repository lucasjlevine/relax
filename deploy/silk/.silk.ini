# Install at SITE ROOT: cp deploy/silk/.silk.ini ~/www-root/.silk.ini
#
# UI  = static files at ~/www-root/public/relax/  (NO Node Unit app)
# API = Python Unit app at /relax-api*
#
# Next.js App Router is incompatible with NGINX Unit’s Node adapter
# (proxy errors / missing application process). Use static export instead.

[general]
document-root = public
max-request-length = 10485760
request-timeout = 60
redirect-insecure-http = true

[python]
version = 3.12

[app: api]
type = python
root = relax/backend
uri = /relax-api*
startup-script = wsgi.py
venv-path = /users/j/l/jlhorton/venvs/relax
env.API_ROOT_PATH = /relax-api
env.DATASETS_PATH = data/local_groups
env.UPLOAD_DIR = data/uploads
env.USER_DATASETS_DIR = data/user_datasets
env.CORS_ORIGINS = ["https://jlhorton.w3.uvm.edu"]
