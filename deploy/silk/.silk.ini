# Install at the SITE ROOT (not inside the repo):
#   cp deploy/silk/.silk.ini ~/www-root/.silk.ini
#
# Non-overlapping Unit URIs (critical: /relax* would also match /relax-api):
#   UI  → /relax and /relax/*   (Next standalone, basePath=/relax)
#   API → /relax-api*           (FastAPI via WSGI)
#
# Build: ./deploy/silk/build-web.sh
# Docs: https://silk.uvm.edu/manual/config-options/

[general]
document-root = public
max-request-length = 10485760
request-timeout = 60
redirect-insecure-http = true

[nodejs]
version = 22

[python]
version = 3.12

# FastAPI — load this first; does not overlap /relax/*
[app: api]
type = python
root = relax/backend
uri = /relax-api*
startup-script = wsgi.py
venv-path = /users/j/l/jlhorton/venvs/relax
env.API_ROOT_PATH = /relax-api
env.DATASETS_PATH = data/local_groups
env.UPLOAD_DIR = data/uploads
env.USER_DATASETS_DIR = data/user_datasets
env.CORS_ORIGINS = ["https://jlhorton.w3.uvm.edu"]

# Next.js — only /relax/... (NOT /relax* which would steal /relax-api)
[app: web]
type = nodejs
root = relax/deploy/silk/dist/web
uri = /relax/*
document-root = public
startup-script = server.js
env.NODE_ENV = production
env.HOSTNAME = 127.0.0.1
env.PORT = 3000

# Exact /relax (no trailing path) → same Next app
[app: web-root]
type = nodejs
root = relax/deploy/silk/dist/web
uri = /relax
document-root = public
startup-script = server.js
env.NODE_ENV = production
env.HOSTNAME = 127.0.0.1
env.PORT = 3000
