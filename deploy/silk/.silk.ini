# Copy to your Silk site root as `.silk.ini` (e.g. ~/www-root/.silk.ini).
# Replace NETID and absolute venv path before loading apps.
# Docs: https://silk.uvm.edu/manual/config-options/

[general]
document-root = public
# Allow dataset uploads up to ~10 MB (app limit is 5 MB + multipart overhead)
max-request-length = 10485760
request-timeout = 60
redirect-insecure-http = true

[nodejs]
version = 22

[python]
version = 3.12

# FastAPI API — more specific URI first
[app: api]
type = python
root = api
uri = /api*
startup-script = wsgi.py
# Absolute path to the venv created on Silk (example path — edit me)
venv-path = /users/N/E/NETID/venvs/relax
env.DATASETS_PATH = data/local_groups
env.UPLOAD_DIR = data/uploads
env.USER_DATASETS_DIR = data/user_datasets
# JSON list; include your real Silk hostname(s)
env.CORS_ORIGINS = ["https://NETID.w3.uvm.edu"]

# Next.js UI (standalone Node build)
[app: web]
type = nodejs
root = web
uri = /*
document-root = public
startup-script = server.js
env.NODE_ENV = production
env.HOSTNAME = 127.0.0.1
env.PORT = 3000
